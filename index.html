<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazin Henna // premium Henna Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFBF7',
                        sand: '#F5EFEB',
                        maroon: '#4A0E17',
                        espresso: '#2B1810',
                        gold: '#D4AF37'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-cream text-espresso font-sans antialiased selection:bg-gold selection:text-white" x-data="storeApp()" x-init="initApp()">

    <!-- Header -->
    <header class="fixed top-0 w-full bg-cream/90 backdrop-blur-md z-40 border-b border-sand/50 shadow-sm transition-all">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" @click="window.scrollTo({top:0, behavior:'smooth'})">
                <template x-if="siteLogo">
                    <img :src="siteLogo" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-sand">
                </template>
                <div class="flex flex-col">
                    <h1 class="font-serif text-2xl font-bold tracking-wide text-maroon leading-tight">Mazin Henna</h1>
                    <span class="text-[10px] text-espresso/60 font-medium tracking-wider uppercase">Powered by Webhut</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button @click="cartOpen = true" class="relative text-espresso hover:text-gold transition-colors flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span x-show="cartTotalItems > 0" x-text="cartTotalItems" class="absolute -top-2 -right-2 bg-maroon text-white text-[10px] font-bold h-5 w-5 rounded-full flex items-center justify-center"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-20 min-h-screen">
        <!-- Hero -->
        <section class="relative bg-cover bg-center overflow-hidden py-32 sm:py-40" style="background-image: url('hero_bg.png');">
            <!-- Smooth fade to page background -->
            <div class="absolute inset-0 bg-espresso/60 mix-blend-multiply"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-maroon/20 to-cream"></div>
            
            <div class="max-w-7xl mx-auto px-6 relative z-10 flex flex-col items-center text-center">
                <h2 class="font-serif text-5xl sm:text-7xl font-bold text-white mb-6 drop-shadow-xl tracking-wide">The Art of Mazin Henna</h2>
                <p class="text-lg sm:text-xl max-w-2xl text-sand mb-10 drop-shadow-md font-medium">Experience the richness of natural, handcrafted henna designed for luxury and lasting impressions.</p>
                <button @click="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" class="bg-gold text-white px-10 py-4 rounded-full hover:bg-yellow-600 transition-all duration-300 font-bold tracking-widest uppercase shadow-xl hover:shadow-2xl transform hover:-translate-y-1 border border-yellow-300/30">Shop Collection</button>
            </div>
        </section>

        <!-- Product Grid -->
        <section id="products" class="max-w-7xl mx-auto px-6 py-20">
            <div class="flex justify-between items-end mb-12">
                <h3 class="font-serif text-3xl font-bold text-espresso">Our Products</h3>
            </div>
            <!-- Categories -->
            <div x-show="categories.length > 0" class="mb-12" x-cloak>
                <div class="flex gap-6 overflow-x-auto pb-4 scrollbar-hide snap-x">
                    <div class="flex flex-col items-center gap-3 min-w-[100px] snap-center cursor-pointer"
                         @click="activeCategory = 'All'">
                        <div class="w-24 h-24 rounded-full border-2 p-1 transition-colors"
                             :class="activeCategory === 'All' ? 'border-maroon' : 'border-sand'">
                            <div class="w-full h-full rounded-full overflow-hidden bg-sand flex items-center justify-center font-serif text-maroon font-medium">
                                All
                            </div>
                        </div>
                        <span class="text-sm font-medium transition-colors" 
                              :class="activeCategory === 'All' ? 'text-maroon' : 'text-espresso'">All</span>
                    </div>
                    
                    <template x-for="cat in categories" :key="cat.name">
                        <div class="flex flex-col items-center gap-3 min-w-[100px] snap-center cursor-pointer"
                             @click="activeCategory = cat.name">
                            <div class="w-24 h-24 rounded-full border-2 p-1 transition-colors"
                                 :class="activeCategory === cat.name ? 'border-maroon' : 'border-sand'">
                                <div class="w-full h-full rounded-full overflow-hidden bg-sand flex items-center justify-center font-serif text-maroon text-xs">
                                    <template x-if="cat.image">
                                        <img :src="cat.image" class="w-full h-full object-cover">
                                    </template>
                                    <template x-if="!cat.image">
                                        <span x-text="cat.name.charAt(0)"></span>
                                    </template>
                                </div>
                            </div>
                            <span class="text-sm font-medium transition-colors" 
                                  :class="activeCategory === cat.name ? 'text-maroon' : 'text-espresso'" x-text="cat.name"></span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
                <template x-for="product in filteredProducts" :key="product.id">
                    <div class="group border border-sand bg-white p-4 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300">
                        <div class="relative w-full h-64 bg-sand rounded-xl overflow-hidden mb-6">
                            <img :src="product.image" :alt="product.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div x-show="product.stock === 0" class="absolute inset-0 bg-white/60 backdrop-blur-[2px] flex items-center justify-center">
                                <span class="bg-espresso text-white px-4 py-1 rounded-full text-sm font-semibold uppercase tracking-wider">Out of Stock</span>
                            </div>
                        </div>
                        <h4 class="font-serif text-xl font-semibold mb-2 text-maroon" x-text="product.name"></h4>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-lg font-medium" x-text="formatPrice(product.price)"></span>
                            <button 
                                @click="addToCart(product)" 
                                :disabled="product.stock === 0"
                                :class="product.stock === 0 ? 'opacity-50 cursor-not-allowed border-sand text-espresso/50' : 'hover:bg-maroon hover:text-white hover:border-maroon'"
                                class="border border-maroon/30 text-maroon px-5 py-2 rounded-full transition-colors font-medium text-sm">
                                Add to Bag
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </main>

    <!-- Slide-out Shopping Bag -->
    <div x-show="cartOpen" class="fixed inset-0 z-50 overflow-hidden" x-cloak>
        <div class="absolute inset-0 bg-espresso/40 backdrop-blur-sm transition-opacity" @click="cartOpen = false" x-show="cartOpen" x-transition.opacity></div>
        
        <div class="fixed inset-y-0 right-0 max-w-md w-full flex">
            <div class="w-full h-full bg-cream shadow-2xl flex flex-col transform transition-transform" 
                 x-show="cartOpen" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="translate-x-full">
                
                <!-- Cart Header -->
                <div class="px-6 py-6 border-b border-sand flex items-center justify-between bg-white">
                    <h2 class="font-serif text-2xl font-bold text-maroon">Your Bag</h2>
                    <button @click="cartOpen = false" class="text-espresso/50 hover:text-espresso p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- Cart Items -->
                <div class="flex-1 overflow-y-auto p-6">
                    <template x-if="cart.length === 0">
                        <div class="h-full flex flex-col items-center justify-center text-center space-y-4 text-espresso/60">
                            <svg class="w-16 h-16 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                            <p>Your bag is empty.</p>
                        </div>
                    </template>
                    
                    <div class="space-y-6">
                        <template x-for="(item, index) in cart" :key="index">
                            <div class="flex gap-4 border-b border-sand/50 pb-6">
                                <div class="w-20 h-20 rounded-lg overflow-hidden bg-sand flex-shrink-0">
                                    <img :src="item.product.image" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-1 flex flex-col justify-between">
                                    <div class="flex justify-between">
                                        <h4 class="font-medium text-maroon" x-text="item.product.name"></h4>
                                        <button @click="removeFromCart(index)" class="text-xs text-red-400 hover:text-red-600">Remove</button>
                                    </div>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="font-medium" x-text="formatPrice(item.product.price * item.quantity)"></span>
                                        <div class="flex items-center border border-sand rounded-lg bg-white">
                                            <button @click="updateCartQuantity(index, -1)" class="px-3 py-1 hover:bg-sand/50 transition-colors text-espresso/70">-</button>
                                            <span class="px-2 text-sm font-medium" x-text="item.quantity"></span>
                                            <button @click="updateCartQuantity(index, 1)" class="px-3 py-1 hover:bg-sand/50 transition-colors text-espresso/70" :disabled="item.quantity >= item.product.stock" :class="{'opacity-50 cursor-not-allowed': item.quantity >= item.product.stock}">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Checkout Section -->
                <div class="border-t border-sand bg-white p-6" x-show="cart.length > 0">
                    <div class="flex justify-between text-lg font-bold text-espresso mb-6">
                        <span>Subtotal</span>
                        <span x-text="formatPrice(cartTotal)"></span>
                    </div>

                    <button 
                        @click="checkout" 
                        :disabled="cart.length === 0 || cartTotal < 200"
                        :class="(cart.length === 0 || cartTotal < 200) ? 'opacity-50 cursor-not-allowed bg-espresso/50' : 'bg-maroon hover:bg-espresso'"
                        class="w-full text-white py-4 rounded-xl font-medium transition-colors shadow-lg flex items-center justify-center gap-2">
                        Checkout
                    </button>
                    <p x-show="cartTotal > 0 && cartTotal < 200" class="text-center text-xs text-red-500 font-bold tracking-wide mt-3" x-cloak>Minimum purchase value is â‚¹200.</p>
                    <p x-show="cartTotal >= 200" class="text-center text-xs text-espresso/50 mt-3" x-cloak>Clicking this will confirm your order and redirect to WhatsApp.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div x-show="toastMessage" 
         x-transition:enter="transition ease-out duration-300" 
         x-transition:enter-start="opacity-0 translate-y-4" 
         x-transition:enter-end="opacity-100 translate-y-0" 
         x-transition:leave="transition ease-in duration-200" 
         x-transition:leave-start="opacity-100 translate-y-0" 
         x-transition:leave-end="opacity-0 translate-y-4" 
         class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-espresso text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3 z-50" x-cloak>
        <span x-text="toastMessage" class="text-sm font-medium"></span>
    </div>

    <script>
        const DB_URL = 'https://mazinhennadatabase-default-rtdb.firebaseio.com';

        async function fbGet(path) {
            try {
                const res = await fetch(`${DB_URL}/${path}.json`);
                return await res.json();
            } catch(e) { console.error('Firebase read error:', e); return null; }
        }

        async function fbSet(path, data) {
            try {
                await fetch(`${DB_URL}/${path}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch(e) { console.error('Firebase write error:', e); }
        }


        function storeApp() {
            return {
                cartOpen: false,
                products: [],
                categories: [],
                activeCategory: 'All',
                siteLogo: null,
                cart: [],
                toastMessage: '',
                toastTimeout: null,

                get filteredProducts() {
                    if (this.activeCategory === 'All') {
                        return this.products;
                    }
                    return this.products.filter(p => p.category === this.activeCategory);
                },

                async initApp() {
                    const products = await fbGet('products');
                    this.products = Array.isArray(products) ? products : (products ? Object.values(products) : []);

                    const categories = await fbGet('categories');
                    this.categories = Array.isArray(categories) ? categories : (categories ? Object.values(categories) : []);

                    const logo = await fbGet('logo');
                    this.siteLogo = logo || null;

                    // Real-time: auto-update when admin changes products
                    const esProducts = new EventSource(`${DB_URL}/products.json?accept=text/event-stream`);
                    esProducts.addEventListener('put', (e) => {
                        const data = JSON.parse(e.data);
                        if (data.data) {
                            this.products = Array.isArray(data.data) ? data.data : Object.values(data.data);
                        }
                    });

                    // Real-time: auto-update when admin changes categories
                    const esCats = new EventSource(`${DB_URL}/categories.json?accept=text/event-stream`);
                    esCats.addEventListener('put', (e) => {
                        const data = JSON.parse(e.data);
                        if (data.data) {
                            this.categories = Array.isArray(data.data) ? data.data : Object.values(data.data);
                        }
                    });

                    // Real-time: logo updates
                    const esLogo = new EventSource(`${DB_URL}/logo.json?accept=text/event-stream`);
                    esLogo.addEventListener('put', (e) => {
                        const data = JSON.parse(e.data);
                        this.siteLogo = data.data || null;
                    });
                },

                async saveProducts() {
                    await fbSet('products', this.products);
                },

                formatPrice(price) {
                    return `â‚¹${Number(price).toLocaleString('en-IN')}`;
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    if (this.toastTimeout) clearTimeout(this.toastTimeout);
                    this.toastTimeout = setTimeout(() => {
                        this.toastMessage = '';
                    }, 3000);
                },

                async addToCart(product) {
                    if (product.stock <= 0) return;

                    // Re-fetch latest stock from Firebase
                    const products = await fbGet('products');
                    this.products = Array.isArray(products) ? products : (products ? Object.values(products) : []);
                    const updatedProduct = this.products.find(p => p.id === product.id);
                    if (!updatedProduct || updatedProduct.stock <= 0) {
                        this.showToast('Product out of stock');
                        return;
                    }

                    const existingItem = this.cart.find(item => item.product.id === product.id);
                    if (existingItem) {
                        if (existingItem.quantity < updatedProduct.stock) {
                            existingItem.quantity++;
                            this.showToast('Bag updated');
                        } else {
                            this.showToast('Maximum stock reached');
                        }
                    } else {
                        this.cart.push({
                            product: { ...updatedProduct },
                            quantity: 1
                        });
                        this.showToast('Added to bag');
                    }
                    this.cartOpen = true;
                },

                removeFromCart(index) {
                    this.cart.splice(index, 1);
                },

                updateCartQuantity(index, delta) {
                    const item = this.cart[index];
                    const productInStock = this.products.find(p => p.id === item.product.id).stock;
                    
                    if (delta === 1 && item.quantity < productInStock) {
                        item.quantity++;
                    } else if (delta === -1 && item.quantity > 1) {
                        item.quantity--;
                    }
                },

                get cartTotal() {
                    return this.cart.reduce((total, item) => total + (item.product.price * item.quantity), 0);
                },
                
                get cartTotalItems() {
                    return this.cart.reduce((total, item) => total + item.quantity, 0);
                },

                async checkout() {
                    if (this.cart.length === 0 || this.cartTotal < 200) return;

                    // Deduct stock
                    this.cart.forEach(cartItem => {
                        const prodIndex = this.products.findIndex(p => p.id === cartItem.product.id);
                        if (prodIndex !== -1) {
                            this.products[prodIndex].stock -= cartItem.quantity;
                            if (this.products[prodIndex].stock < 0) this.products[prodIndex].stock = 0;
                        }
                    });

                    await this.saveProducts();

                    // Build WhatsApp Message
                    let message = `*NEW ORDER: MAZIN HENNA* %0A%0A`;
                    message += `*Order Items:*%0A`;
                    
                    this.cart.forEach(item => {
                        message += `- ${item.quantity}x ${item.product.name} (â‚¹${item.product.price * item.quantity})%0A`;
                    });
                    
                    message += `%0A*Subtotal:* â‚¹${this.cartTotal}%0A`;
                    message += `Please confirm my order.`;

                    const phoneNumber = '7592083435'; 
                    const waUrl = `https://wa.me/${phoneNumber}?text=${message}`;
                    
                    // Clear cart
                    this.cart = [];
                    this.cartOpen = false;
                    
                    this.showToast('Order placed successfully!');
                    
                    // Open WhatsApp
                    window.open(waUrl, '_blank');
                }
            }
        }
    </script>
</body>
</html>
